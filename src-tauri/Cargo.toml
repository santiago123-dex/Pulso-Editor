[package]
name = "pulso-editor"
version = "0.2.2"
edition = "2021"
license = "MIT"
default-run = "pulso-editor"

[lib]
name = "pulso_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pulso-editor"
path = "src/main.rs"

# El comando de la terminal (`pulso`): asistente de IA y apertura de la ventana. Es una aplicación de consola.
[[bin]]
name = "pulso"
path = "src/bin/pulso.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.dev]
debug = 0
incremental = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
trash = "5"
portable-pty = "0.9"
base64 = "0.22"
# Cifrado del historial del chat (AES-256-GCM). Ya estaba en el árbol por rustls: no añade nada nuevo a la compilación.
ring = "0.17"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
ignore = "0.4"
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
