# Al subir una etiqueta vX.Y.Z genera los instaladores y los deja en un borrador de release de GitHub.
# La versión de la etiqueta debe coincidir con la de src-tauri/tauri.conf.json.
name: Publicación

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Instalador (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar y adjuntar a la release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de los paquetes de actualización (ver docs/DISTRIBUCION.md). La clave privada solo vive en los secretos.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Pulso Editor v__VERSION__
          releaseBody: Instaladores sin firmar. En Windows, SmartScreen mostrará una advertencia.
          # Borrador: hay que publicarlo a mano. No se marca como versión preliminar porque las
          # actualizaciones leen latest.json de la última release publicada, que excluye las preliminares.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
