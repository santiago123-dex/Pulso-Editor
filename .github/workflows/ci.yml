# Pruebas en cada push y pull request, en Windows y Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas TypeScript
        run: npm test

      - name: Comprobación de tipos y compilación web
        run: npm run build

      - name: Pruebas del arranque del servidor de lenguaje
        run: npm run test:windows

      - name: Pruebas Rust
        run: npm run test:rust

  # Calidad: formato, lints y auditoría de dependencias. Por ahora solo avisan: el proyecto
  # todavía no está formateado de forma uniforme y no debe bloquear los PR ni salir en rojo: cada paso de comprobación lleva `continue-on-error`, así que un fallo se ve como aviso en el paso pero el trabajo termina en verde. Cuando estén limpios se quita.
  calidad:
    name: Calidad (aviso)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Formato de Rust
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Formato de TypeScript
        continue-on-error: true
        run: npm run format:check

      - name: Auditoría de npm (producción)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría de crates de Rust
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
